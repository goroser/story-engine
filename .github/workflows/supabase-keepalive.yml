# Free-tier Supabase projects pause after a week of low activity.
# Supabase docs: "a few user requests to the database each day" keeps a
# project awake, so this runs three times a day and reads several tables.
# Several runs a day also cover GitHub delaying or skipping a scheduled run.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 2,10,18 * * *" # every 8 hours, off the top of the hour
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read a row from each table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          failed=0
          for table in stories chunks; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
              "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY") || code=000
            echo "$table: HTTP $code"
            [ "$code" = "200" ] || failed=1
          done
          if [ "$failed" = 1 ]; then
            echo "::error::Supabase did not answer. If the host does not resolve, the project is paused: restore it in the dashboard."
            exit 1
          fi
